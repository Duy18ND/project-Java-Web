<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - Smart Lab Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login-register.css}">
</head>
<body>

<div class="auth-wrapper" id="loginView">
    <div class="header">
        <h1>Đăng Nhập</h1>
    </div>

    <div th:if="${param.error}" style="color: #dc2626; font-size: 13px; text-align: center; margin-bottom: 10px; background: #fee2e2; padding: 10px; border-radius: 8px;">
        <i class="fa-solid fa-triangle-exclamation"></i> Tên đăng nhập hoặc mật khẩu không đúng.
    </div>

    <form th:action="@{/login}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label class="label" for="loginUsername">Tên đăng nhập</label>
                <input class="input" id="loginUsername" name="username" placeholder="Nhập tên đăng nhập" required type="text" />
            </div>
            <div class="form-group">
                <div class="label-wrapper">
                    <label class="label" for="loginPassword">Mật khẩu</label>
                    <a href="#" class="link">Quên mật khẩu?</a>
                </div>
                <div class="input-container">
                    <input class="input" id="loginPassword" name="password" required type="password" placeholder="••••••••" />
                    <i class="fas fa-eye-slash password-toggle" onclick="togglePassword('loginPassword', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </div>
    </form>

    <p class="footer-text">
        Chưa có tài khoản?
        <a class="link" style="text-underline-offset: 4px; cursor: pointer;" id="showRegisterBtn">Đăng ký ngay</a>
    </p>
</div>

<div class="auth-wrapper hidden" id="registerView">
    <div class="header">
        <h1>Đăng Ký</h1>
    </div>

    <form th:action="@{/register}" method="POST" th:object="${registerRequest}">

        <input type="hidden" id="hasErrors" th:value="${hasRegisterErrors != null and hasRegisterErrors} ? 'true' : 'false'">
        <input type="hidden" id="alertMessage" th:value="${alertMessage}">

        <div class="form-grid">
            <div class="form-group">
                <label class="label" for="regName">Họ và tên *</label>
                <input class="input" id="regName" th:field="*{fullName}" placeholder="Nguyễn Văn A" type="text" />
                <span class="error-text" th:if="${#fields.hasErrors('fullName')}" th:text="${#fields.errors('fullName')[0]}"></span>
            </div>

            <div class="form-group">
                <label class="label" for="regEmail">Email *</label>
                <input class="input" id="regEmail" th:field="*{email}" placeholder="sv@example.com" type="text" />
                <span class="error-text" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></span>
            </div>

            <div class="form-group">
                <label class="label" for="regUsername">Tên đăng nhập *</label>
                <input class="input" id="regUsername" th:field="*{username}" placeholder="Nhập tên đăng nhập" type="text" />
                <span class="error-text" th:if="${#fields.hasErrors('username')}" th:text="${#fields.errors('username')[0]}"></span>
            </div>

            <div class="form-group">
                <label class="label" for="regPhone">Số điện thoại *</label>
                <input class="input" id="regPhone" th:field="*{phoneNumber}" placeholder="0987654321" type="text" />
                <span class="error-text" th:if="${#fields.hasErrors('phoneNumber')}" th:text="${#fields.errors('phoneNumber')[0]}"></span>
            </div>

            <div class="form-group">
                <label class="label" for="regPassword">Mật khẩu *</label>
                <div class="input-container">
                    <input class="input" id="regPassword" name="password" th:value="*{password}" type="password" placeholder="••••••••" />
                    <i class="fas fa-eye-slash password-toggle" onclick="togglePassword('regPassword', this)"></i>
                </div>
                <span class="error-text" th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></span>
            </div>

            <div class="form-group">
                <label class="label" for="regConfirmPassword">Xác nhận mật khẩu *</label>
                <div class="input-container">
                    <input class="input" id="regConfirmPassword" name="confirmPassword" th:value="*{confirmPassword}" type="password" placeholder="••••••••" />
                    <i class="fas fa-eye-slash password-toggle" onclick="togglePassword('regConfirmPassword', this)"></i>
                </div>
                <span class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:text="${#fields.errors('confirmPassword')[0]}"></span>
            </div>

            <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1;">Đăng ký</button>
        </div>
    </form>

    <p class="footer-text">
        Đã có tài khoản?
        <a class="link" style="text-underline-offset: 4px; cursor: pointer;" id="showLoginBtn">Đăng nhập</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/alert2.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener("DOMContentLoaded", function() {

        // 1. Báo thành công khi đăng ký xong
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('success') && typeof showSuccessAlert === "function") {
            showSuccessAlert("Đăng ký tài khoản thành công! Bạn có thể đăng nhập ngay.");
        }

        // 2. Giữ lại Tab Đăng ký và hiển thị lỗi nếu Java chặn
        const hasErrors = document.getElementById('hasErrors')?.value;
        const alertMsg = document.getElementById('alertMessage')?.value;
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');

        if (hasErrors === 'true') {
            loginView.classList.add('hidden');
            registerView.classList.remove('hidden');

            if (typeof showErrorAlert === "function") {
                showErrorAlert(alertMsg || "Vui lòng kiểm tra lại các thông tin màu đỏ!");
            }
        }

        // 3. Logic chuyển đổi Tab
        document.getElementById('showRegisterBtn').addEventListener('click', function() {
            loginView.classList.add('hidden');
            registerView.classList.remove('hidden');
        });

        document.getElementById('showLoginBtn').addEventListener('click', function() {
            registerView.classList.add('hidden');
            loginView.classList.remove('hidden');
        });
    });

    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconElement.classList.remove("fa-eye-slash");
            iconElement.classList.add("fa-eye");
        } else {
            input.type = "password";
            iconElement.classList.remove("fa-eye");
            iconElement.classList.add("fa-eye-slash");
        }
    }
    /*]]>*/
</script>

</body>
</html>
